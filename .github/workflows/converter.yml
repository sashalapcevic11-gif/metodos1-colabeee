
name: Converter Colab para Python

on:
  push:
    paths:
      - '**/*.ipynb'

permissions:
  contents: write

jobs:
  converter:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Instalar conversor
        run: pip install nbconvert ipykernel

      - name: Converter notebooks
        run: |
          find . -name "*.ipynb" -not -path "./.git/*" -print0 |
            while IFS= read -r -d '' arquivo; do
              jupyter nbconvert --to script "$arquivo"
            done

      - name: Salvar arquivos Python
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.py'
          if ! git diff --cached --quiet; then
            git commit -m "Atualizar códigos Python"
            git push
          fi
